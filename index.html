<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <title>仁爱单词通</title>
</head>
<body>
  <div id="app">
    <!-- 登录/注册 -->
    <section id="login-view">
      <h2>仁爱单词通</h2>
      <input id="login-email" type="email" placeholder="邮箱" />
      <input id="login-password" type="password" placeholder="密码（至少6位）" />
      <select id="login-role">
        <option value="student">学生</option>
        <option value="teacher">教师</option>
      </select>
      <button id="btn-signup">注册</button>
      <button id="btn-login">登录</button>
    </section>

    <!-- 学生首页 -->
    <section id="student-home" style="display:none">
      <h2>选择单元</h2>
      <div id="unit-list"></div>
      <button id="btn-logout-student">退出登录</button>
    </section>

    <!-- 教师首页 -->
    <section id="teacher-home" style="display:none">
      <h2>我的班级</h2>
      <div id="class-list"></div>
      <button id="btn-create-class">创建班级</button>
      <button id="btn-logout-teacher">退出登录</button>
    </section>

    <!-- 单词学习页 -->
    <section id="word-study" style="display:none">
      <h2 id="study-title">单词学习</h2>
      <div id="word-cards"></div>
      <button id="btn-back-study">返回</button>
    </section>

    <!-- 教师点评页 -->
    <section id="teacher-comment" style="display:none">
      <h2>学生详情</h2>
      <div id="student-detail"></div>
      <textarea id="comment-text" placeholder="输入文字点评..."></textarea>
      <button id="btn-record">🎤 开始录音</button>
      <button id="btn-send-comment">发送点评</button>
      <button id="btn-back-comment">返回</button>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
  <script>
// =============================================
// 请将下面两行替换成你自己的 Supabase 信息
// =============================================
const SUPABASE_URL = 'https://gzzkiynxaggepyqrjtdp.supabase.co'; // 你的 Project URL
const SUPABASE_KEY = 'sb_publishable_I1y3k3O2cnH74CTVKIR-Dg_g-U047Nz'; // 你的 Publishable Key
// =============================================

// 只声明一次 supabase，后续所有代码复用这个变量
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;

// 视图切换
function showView(viewId) {
  document.querySelectorAll('section').forEach(s => s.style.display = 'none');
  document.getElementById(viewId).style.display = 'block';
}

// 初始化
async function init() {
  try {
    const { data: { user } } = await supabase.auth.getUser();
    if (user) {
      currentUser = user;
      const { data: profile, error: profileError } = await supabase.from('profiles').select('*').eq('id', user.id).single();
      if (profileError) {
        alert('获取用户资料失败：' + profileError.message);
        return;
      }
      currentProfile = profile;
      if (profile.role === 'student') loadStudentHome();
      else loadTeacherHome();
    } else {
      showView('login-view');
    }
  } catch (e) {
    alert('初始化错误：' + e.message);
  }
}

// 注册
document.getElementById('btn-signup').addEventListener('click', async () => {
  try {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const role = document.getElementById('login-role').value;
    if (!email || !password) { alert('请填写邮箱和密码'); return; }
    if (password.length < 6) { alert('密码至少6位'); return; }

    const { data, error } = await supabase.auth.signUp({ email, password });
    if (error) { alert('注册失败：' + error.message); return; }
    if (!data.user) { alert('注册未返回用户信息，可能邮箱确认已开启。请在 Supabase 中暂时关闭邮箱确认。'); return; }

    const { error: insertError } = await supabase.from('profiles').insert([
      { id: data.user.id, email: email, role: role }
    ]);
    if (insertError) { alert('用户资料保存失败：' + insertError.message); return; }
    alert('注册成功！请点击“登录”按钮登录。');
  } catch (e) { alert('注册异常：' + e.message); }
});

// 登录
document.getElementById('btn-login').addEventListener('click', async () => {
  try {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) { alert('请填写邮箱和密码'); return; }

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { alert('登录失败：' + error.message); return; }
    currentUser = data.user;
    const { data: profile, error: profileError } = await supabase.from('profiles').select('*').eq('id', data.user.id).single();
    if (profileError) { alert('获取用户资料失败：' + profileError.message + '（可能未完成注册或数据库RLS未配置）'); return; }
    currentProfile = profile;
    if (profile.role === 'student') loadStudentHome();
    else loadTeacherHome();
  } catch (e) { alert('登录异常：' + e.message); }
});

// 学生加载单元
async function loadStudentHome() {
  showView('student-home');
  try {
    const { data: words, error } = await supabase.from('words').select('unit');
    if (error) { alert('获取单元失败：' + error.message); return; }
    const units = [...new Set(words.map(w => w.unit))];
    const unitList = document.getElementById('unit-list');
    unitList.innerHTML = '';
    units.forEach(unit => {
      const btn = document.createElement('button');
      btn.textContent = unit;
      btn.onclick = () => loadWordStudy(unit);
      unitList.appendChild(btn);
    });
  } catch (e) { alert('加载单元异常：' + e.message); }
}

// 加载单词
async function loadWordStudy(unit) {
  showView('word-study');
  document.getElementById('study-title').textContent = unit;
  try {
    const { data: words, error } = await supabase.from('words').select('*').eq('unit', unit);
    if (error) { alert('获取单词失败：' + error.message); return; }
    const container = document.getElementById('word-cards');
    container.innerHTML = '';
    words.forEach(w => {
      const div = document.createElement('div');
      div.className = 'word-card';
      div.innerHTML = `
        <strong>${w.word}</strong> <span class="phonetic">${w.phonetic || ''}</span>
        <div class="meaning">${w.meaning}</div>
      `;
      container.appendChild(div);
    });
  } catch (e) { alert('加载单词异常：' + e.message); }
}

// 教师加载班级
async function loadTeacherHome() {
  showView('teacher-home');
  try {
    const { data: classes, error } = await supabase.from('classes').select('*').eq('teacher_id', currentProfile.id);
    if (error) { alert('获取班级失败：' + error.message); return; }
    const classList = document.getElementById('class-list');
    classList.innerHTML = '';
    if (classes) {
      classes.forEach(cls => {
        const btn = document.createElement('button');
        btn.textContent = cls.name + ' (邀请码: ' + cls.invite_code + ')';
        btn.onclick = () => loadClassStudents(cls.id);
        classList.appendChild(btn);
      });
    }
  } catch (e) { alert('加载班级异常：' + e.message); }
}

// 加载班级学生
async function loadClassStudents(classId) {
  try {
    const { data: members, error } = await supabase.from('class_members').select('student_id').eq('class_id', classId);
    if (error) { alert('获取班级成员失败：' + error.message); return; }
    if (!members) return;
    const studentList = document.getElementById('student-detail');
    studentList.innerHTML = '<h3>学生列表</h3>';
    for (const m of members) {
      const { data: student } = await supabase.from('profiles').select('name, email').eq('id', m.student_id).single();
      const btn = document.createElement('button');
      btn.textContent = student?.name || student?.email || '未知学生';
      btn.onclick = () => loadStudentComments(m.student_id, classId);
      studentList.appendChild(btn);
    }
    showView('teacher-comment');
  } catch (e) { alert('加载学生异常：' + e.message); }
}

// 点评相关
let currentCommentStudentId = null;
let voiceBlob = null;
function loadStudentComments(studentId, classId) {
  currentCommentStudentId = studentId;
  document.getElementById('comment-text').value = '';
  supabase.from('comments').select('*').eq('student_id', studentId).order('created_at', { ascending: false })
    .then(({ data, error }) => {
      if (error) { alert('获取点评失败：' + error.message); return; }
      const container = document.getElementById('student-detail');
      container.innerHTML = '<h3>历史点评</h3>';
      if (data) {
        data.forEach(c => {
          const p = document.createElement('p');
          p.textContent = c.text_content || '[语音点评]';
          if (c.voice_url) {
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.src = c.voice_url;
            p.appendChild(audio);
          }
          container.appendChild(p);
        });
      }
    });
  showView('teacher-comment');
}

document.getElementById('btn-send-comment').addEventListener('click', async () => {
  try {
    const text = document.getElementById('comment-text').value.trim();
    if (!text && !voiceBlob) { alert('请输入文字或录制语音'); return; }
    let voiceUrl = null;
    if (voiceBlob) {
      const fileName = `comments/${Date.now()}.webm`;
      const { data, error } = await supabase.storage.from('voices').upload(fileName, voiceBlob);
      if (error) { alert('语音上传失败：' + error.message); return; }
      voiceUrl = data.path;
    }
    const { error } = await supabase.from('comments').insert([{
      teacher_id: currentProfile.id,
      student_id: currentCommentStudentId,
      task_id: null,
      text_content: text,
      voice_url: voiceUrl
    }]);
    if (error) { alert('点评发送失败：' + error.message); return; }
    alert('点评发送成功');
    voiceBlob = null;
    document.getElementById('comment-text').value = '';
  } catch (e) { alert('发送点评异常：' + e.message); }
});

// 录音
let mediaRecorder;
document.getElementById('btn-record').addEventListener('click', async () => {
  try {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      document.getElementById('btn-record').textContent = '🎤 开始录音';
      return;
    }
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    const chunks = [];
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => { voiceBlob = new Blob(chunks, { type: 'audio/webm' }); };
    mediaRecorder.start();
    document.getElementById('btn-record').textContent = '⏹ 停止录音';
  } catch (e) { alert('无法录音：' + e.message); }
});

// 其他按钮
document.getElementById('btn-back-study').onclick = () => loadStudentHome();
document.getElementById('btn-back-comment').onclick = () => loadTeacherHome();
document.getElementById('btn-logout-student').onclick = () => { supabase.auth.signOut(); showView('login-view'); };
document.getElementById('btn-logout-teacher').onclick = () => { supabase.auth.signOut(); showView('login-view'); };
document.getElementById('btn-create-class').addEventListener('click', async () => {
  const name = prompt('班级名称？');
  if (!name) return;
  const code = Math.random().toString(36).substring(2, 8).toUpperCase();
  const { error } = await supabase.from('classes').insert([{ teacher_id: currentProfile.id, name, invite_code: code }]);
  if (error) alert('创建班级失败：' + error.message);
  else loadTeacherHome();
});

// 启动
init();
</script>
</body>
</html>
