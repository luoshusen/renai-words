<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <title>仁爱单词通</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 1.5rem; }
    input, select, button { display: block; width: 100%; margin: 0.5rem 0; padding: 0.75rem; font-size: 1rem; box-sizing: border-box; }
    button { background: #4f46e5; color: white; border: none; cursor: pointer; font-weight: bold; }
    .word-card { background: #f0f4ff; padding: 1rem; margin: 0.5rem 0; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>仁爱单词通</h2>

  <!-- 登录区域 -->
  <div id="login-box">
    <input id="email" type="email" placeholder="邮箱" />
    <input id="password" type="password" placeholder="密码（至少6位）" />
    <select id="role">
      <option value="student">学生</option>
      <option value="teacher">教师</option>
    </select>
    <button id="btn-signup">注册</button>
    <button id="btn-login">登录</button>
  </div>

  <!-- 应用区域（登录后显示） -->
  <div id="app-box" style="display:none">
    <button id="btn-logout">退出登录</button>
    <h3>单元列表</h3>
    <div id="unit-list"></div>
  </div>

  <!-- 加载 Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 唯一的一个脚本，只有一处 const supabase -->
  <script>
    const SUPABASE_URL = 'https://gzzkiynxaggepyqrjtdp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_I1y3k3O2cnH74CTVKIR-Dg_g-U047Nz';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 注册
    document.getElementById('btn-signup').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      if (!email || !password) return alert('请填写邮箱和密码');
      if (password.length < 6) return alert('密码至少6位');

      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) return alert('注册失败：' + error.message);
      if (!data.user) return alert('请先在 Supabase 中暂时关闭邮箱确认。');

      const { error: insertError } = await supabase.from('profiles').insert([
        { id: data.user.id, email, role }
      ]);
      if (insertError) return alert('用户资料保存失败：' + insertError.message);
      alert('注册成功！请点击登录。');
    });

    // 登录
    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return alert('请填写邮箱和密码');

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return alert('登录失败：' + error.message);

      document.getElementById('login-box').style.display = 'none';
      document.getElementById('app-box').style.display = 'block';

      const { data: words, error: wordsError } = await supabase.from('words').select('unit');
      if (wordsError) return alert('获取单元失败：' + wordsError.message);
      const units = [...new Set(words.map(w => w.unit))];
      const list = document.getElementById('unit-list');
      list.innerHTML = '';
      units.forEach(u => {
        const btn = document.createElement('button');
        btn.textContent = u;
        btn.onclick = () => alert('你选择了 ' + u);
        list.appendChild(btn);
      });
    });

    // 退出
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      document.getElementById('login-box').style.display = 'block';
      document.getElementById('app-box').style.display = 'none';
    });
  </script>
</body>
</html>
